[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iet-ch5"
version = "0.1.0"
description = "Chapter 5 conventional quadrotor control and AirSim evidence"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "msgpack==1.1.2"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1"]
plots = ["matplotlib==3.10.7", "imageio==2.37.2", "imageio-ffmpeg==0.6.0"]
mpc = ["osqp==1.0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in AirSim tests requiring an explicitly selected server"]

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
"*" = ["config.json", "README.md"]
"iet_ch5.trajectories" = ["configs/*.json"]
